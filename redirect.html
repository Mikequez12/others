<iframe></iframe>
<style>
    iframe {
        border:none;
        outline:none;
        width:100%;
        height:100%;
    }
</style>
<script>
    urlvars = JSON.parse('{'+window.location.hash.slice(1).split('&').map((el)=>(el.split('=').map((v)=>`"${v}"`).join(':'))).join(',')+'}');
    if (urlvars.redirect == "0") {
        document.querySelector('iframe').src=decodeURIComponent(urlvars.link);
    } else {
        urlvars.redirect = parseInt(urlvars.redirect)-1;
        document.querySelector('iframe').src=`${window.location.href.split('#')[0]}#link=${urlvars.link}&redirect=${urlvars.redirect}`;
        alert(document.querySelector('iframe').src)
    }
</script>
