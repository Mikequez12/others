<iframe></iframe>
<style>
    iframe {
        width:100%;
        height:100%;
    }
</style>
<script>
let urlvars = {};
window.location.hash.slice(1).split('&').forEach((el) => {
    const [key, value] = el.split('=');
    urlvars[key] = decodeURIComponent(value);
});

if (urlvars.redirect === "0") {
    document.querySelector('iframe').src = decodeURIComponent(urlvars.link);
} else {
    // Decrementar el valor de 'redirect'
    urlvars.redirect = parseInt(urlvars.redirect) - 1;
    
    // Asegúrate de mantener correctamente los parámetros de la URL
    let newUrl = `https://mikequez12.github.io/others/redirect.html#link=${encodeURIComponent(urlvars.link)}&redirect=${urlvars.redirect}`;
    //             #link=https%3A%2F%2Fgoogle.com&redirect=10
    
    document.querySelector('iframe').src = 'https://google.com'//newUrl;
    alert(`UPDATED 3.0: ${newUrl}`);  // Verifica la URL generada
}

</script>
